<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Team Schedule Admin | Kings Hockey Academy</title><link rel="stylesheet" href="styles.css?v=private-team-pages-2"></head>
<body class="admin-page" data-team-schedule-admin>
<header class="site-header"><div class="wrap brand-wrap"><a class="brand" href="index.html" aria-label="Kings Hockey Academy home"><span class="brand-mark"><img src="assets/kha-logo.png" alt="Kings Hockey Academy logo"></span></a></div></header>
<div class="menu-bar"><nav class="main-nav wrap" aria-label="Main navigation"><a href="index.html">Home</a><a href="teams.html">Teams</a><a href="parent-account.html">Login</a></nav></div>
<header class="admin-head"><a class="brand" href="index.html"><span class="crest">K</span><span>KINGS <small>TEAM MANAGEMENT</small></span></a><div class="admin-top-actions"><a class="admin-top-link" href="admin-dashboard.html">SUBMISSIONS</a><a class="admin-top-link" href="admin-accounts.html">ACCOUNTS</a><a class="admin-top-link is-current" href="admin-team-schedule.html" aria-current="page">TEAM SCHEDULES</a><button class="admin-logout" data-admin-logout type="button">Sign out</button></div></header>
<main class="admin-main team-schedule-admin"><p class="eyebrow red">PRIVATE TEAM MANAGEMENT</p><h1>TEAM<br><em>SCHEDULES.</em></h1><p data-team-admin-email></p><div class="alert error admin-message" data-team-admin-message role="status" hidden></div>
<section class="team-admin-panel"><div class="team-admin-panel-heading"><div><p class="eyebrow red">EVENT MANAGER</p><h2>ADD OR EDIT<br><em>AN EVENT.</em></h2></div></div>
<form data-team-event-form class="team-event-form"><input type="hidden" name="id"><label>Team <b>*</b><select name="team_slug" required><option value="nova-scotia-kings">Nova Scotia Kings</option><option value="nova-scotia-vipers">Nova Scotia Vipers</option><option value="quebec-predators">Quebec Predators</option><option value="montreal-sentinels">Montreal Sentinels</option></select></label>
<label>Age group <b>*</b><select name="age_group" required><option>U9</option><option>U11</option><option>U13</option><option>U15</option></select></label>
<label>Event type <b>*</b><select name="event_type" required><option>Practice</option><option>Game</option><option>Tournament</option><option>Team Event</option><option>Other</option></select></label>
<label>Event title <b>*</b><input name="title" maxlength="160" required placeholder="e.g. Team practice"></label>
<label>Date <b>*</b><input name="event_date" type="date" required></label><label>Start time <small>(Atlantic Time)</small><input name="start_time" type="time"></label><label>End time <small>(Atlantic Time)</small><input name="end_time" type="time"></label>
<label>Location<input name="location" maxlength="300" placeholder="Arena / rink / address"></label><label class="team-event-details-field">Details<textarea name="details" rows="4" maxlength="3000" placeholder="Bring equipment, tournament notes, etc."></textarea></label>
<div class="team-event-form-actions"><button class="button button-gold" type="submit" data-event-save>SAVE EVENT <b>↗</b></button><button class="button button-outline" type="button" data-event-cancel hidden>CANCEL EDIT</button></div></form></section>
<section class="team-admin-panel"><div class="team-admin-filter"><label>View team<select data-event-filter-team><option value="all">All teams</option><option value="nova-scotia-kings">Nova Scotia Kings</option><option value="nova-scotia-vipers">Nova Scotia Vipers</option><option value="quebec-predators">Quebec Predators</option><option value="montreal-sentinels">Montreal Sentinels</option></select></label><label>Age group<select data-event-filter-age><option value="all">All age groups</option><option>U9</option><option>U11</option><option>U13</option><option>U15</option></select></label></div><div data-team-admin-events><p>Loading events…</p></div></section>
</main><script src="supabase-config.js"></script><script type="module" src="js/admin-team-schedule.js?v=private-team-pages-2"></script></body></html>
