<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Sign In | Kings Hockey Academy</title>
  <link rel="stylesheet" href="styles.css?v=admin-pages-3">
</head>
<body class="admin-page" data-admin-page="login">
  <header class="site-header">
    <div class="wrap brand-wrap">
      <a class="brand" href="index.html" aria-label="Kings Hockey Academy home">
        <span class="brand-mark"><img src="assets/kha-logo.png" alt="Kings Hockey Academy logo"></span>
      </a>
    </div>
  </header>
  <div class="menu-bar">
    <nav class="main-nav wrap" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <div class="nav-dropdown">
        <a href="teams.html">Teams</a>
        <button class="nav-dropdown-toggle" type="button" aria-label="Show Teams subpages" aria-expanded="false"><span aria-hidden="true">⌄</span></button>
        <div class="nav-submenu">
          <a href="teams/nova-scotia-kings.html">Nova Scotia Kings</a>
          <a href="teams/nova-scotia-vipers.html">Nova Scotia Vipers</a>
        </div>
      </div>
      <a href="registration.html">Registration</a>
    </nav>
  </div>
  <div class="admin-login-wrap">
    <div class="alert error" data-admin-message hidden role="status"></div>
    <form class="admin-login" data-admin-login>
      <span class="crest">K</span>
      <h1>REGISTRATION<br>ADMIN</h1>
      <p class="admin-login-intro">Sign in to manage camp registration inquiries.</p>
      <label>Admin email<input type="email" name="email" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="button button-red" type="submit">SIGN IN ↗</button>
      <a href="index.html">← Return to website</a>
    </form>
  </div>
  <script src="supabase-config.js"></script>
  <script src="js/site.js"></script>
  <script type="module" src="js/admin.js?v=admin-pages-3"></script>
</body>
</html>
